<mat-nav-list class="menu-scroll" (mouseenter)="mouseEnter()" (mouseleave)="mouseLeave()">
  @for (item of menuItems; track item) {
    @if (!groups.has(item)) {
      <mat-list-item
        routerLink="{{ item.routerLink }}" [routerLinkActive]="['active']"
        [routerLinkActiveOptions]="{exact:true}">
        <mat-icon matListItemIcon color="accent">{{ item.icon }}</mat-icon>
        <span matListItemTitle  style="margin-left: 4px;"> {{ item.label }}@if (isExpanded) {<juice-menu-badge [badge]="badges.get(item.id)" [menuId]="item.id"></juice-menu-badge>}</span>
        @if (!isExpanded) {
          <juice-menu-badge [badge]="badges.get(item.id)" [folded]="true" [menuId]="item.id"></juice-menu-badge>
        }
      </mat-list-item>
    } @else {
      <juice-expandable-menu
      [item]="item" [isExpanded]="isExpanded"></juice-expandable-menu>
    }
  }
</mat-nav-list>
<mat-divider></mat-divider>
<mat-action-list class="list-horizontal bottom-menu">
  @if (settingUrl) {
    <a mat-list-item [href]="settingUrl"
      matTooltip="{{'Settings' | translate}}" matTooltipPosition="right" [matTooltipDisabled]="isExpanded">
      <mat-icon>settings</mat-icon>
    </a>
  }
  @if (!isMobile) {
    <button mat-list-item (click)="toggle()">
      <mat-icon [style.transform]= "isExpanded ? 'rotate(-180deg)':'rotate(0)'">double_arrow</mat-icon>
    </button>
  }
</mat-action-list>
