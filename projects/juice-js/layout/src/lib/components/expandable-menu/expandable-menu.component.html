<mat-expansion-panel [expanded]="open" [hideToggle]="!isExpanded" [class.active]="open">
  <mat-expansion-panel-header>
    <mat-list-item [routerLink]="headerLink" [class.active]="headerActive">
      <mat-icon matListItemIcon color="accent">{{ item.icon }}</mat-icon>
      @if (isExpanded) {
        <span matListItemTitle style="margin-left: 4px;"> {{ item.label }}</span>
      }
    </mat-list-item>
  </mat-expansion-panel-header>
  <mat-nav-list>
    @for (subitem of children; track subitem) {
      <mat-list-item routerLink="{{ subitem.routerLink }}" [routerLinkActive]="['active']"
        [routerLinkActiveOptions]="{exact: true}">
        <mat-icon matListItemIcon color="accent">{{ subitem.icon }}</mat-icon>
        @if (isExpanded) {
          <span matListItemTitle style="margin-left: 4px;"> {{ subitem.label }}</span>
        }
      </mat-list-item>
    }
  </mat-nav-list>
</mat-expansion-panel>
